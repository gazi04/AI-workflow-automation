[project]
requires-python = ">=3.13"
name = "workflow-automation"
version = "0.1.0"
description = "AI workflow automation"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "SQLAlchemy",
  "psycopg2-binary",
  "asyncpg",
  "pydantic[email]",
  "azure-ai-inference",
  "httpx",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
  "google-auth-httplib2",
  "PyJWT",
  "passlib[bcrypt]",
  "pydantic-settings>=2.11.0",
  "prefect",
  "alembic>=1.17.2",
  "cryptography>=46.0.3",
  "slowapi>=0.1.9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "ipython>=9.11.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "py-spy>=0.4.2",
    "pydeps>=3.0.6",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.13.2",
    "vulture>=2.16",
]

[tool.setuptools]
packages = ["ai", "auth", "core", "user", "workflow"]

[tool.importlinter]
root_packages = ["ai", "auth", "core", "gmail", "orchestration", "processed_messages", "user", "workflow"]

[[tool.importlinter.contracts]]
name = "auth layering"
type = "layers"
layers = ["auth.routes", "auth.services", "auth.schemas", "auth.models"]

[[tool.importlinter.contracts]]
name = "workflow layering"
type = "layers"
layers = ["workflow.routes", "workflow.services", "workflow.schemas", "workflow.models"]

[[tool.importlinter.contracts]]
name = "user layering"
type = "layers"
layers = ["user.routes", "user.services", "user.schemas", "user.models"]

[[tool.importlinter.contracts]]
name = "ai layering"
type = "layers"
layers = ["ai.routes", "ai.services", "ai.schemas"]

[[tool.importlinter.contracts]]
name = "gmail layering"
type = "layers"
layers = ["gmail.routes", "gmail.services", "gmail.schemas"]

[[tool.importlinter.contracts]]
name = "processed_messages layering"
type = "layers"
layers = ["processed_messages.services", "processed_messages.models"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
