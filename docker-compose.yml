# backend and prefect-worker run the same code from the same image. Sharing one
# build definition and one tag keeps a single image on disk and stops the two
# from drifting onto different dependency sets.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

services:
  postgres:
    # Pinned to a major: `latest` would eventually jump to PG 19 and refuse to
    # start against a PG 18 data directory.
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # PG 18+ images store the cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) and no longer ship the `data -> .`
      # compat symlink, so the mount belongs one level up. The existing volume
      # already holds 18/docker, so this preserves the data as-is.
      - postgres_data:/var/lib/postgresql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  # Opt-in: `docker compose --profile tools up -d pgadmin`. Kept out of the
  # default set because it idles at ~236 MiB. Postgres is on host port 5433 for
  # any other client.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=test@test.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "8888:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    mem_limit: 384m

  prefect-server:
    image: prefecthq/prefect:3.8.0-python3.13
    restart: always
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/prefect
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_URL=http://127.0.0.1:4200/api
      # Off by default upstream; resource metrics alone poll every 10s.
      - PREFECT_SERVER_ANALYTICS_ENABLED=false
      - PREFECT_TELEMETRY_ENABLE_RESOURCE_METRICS=false
      - PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY=false
    depends_on:
      postgres:
        condition: service_healthy
    # The postgres healthcheck above is what startup actually waits on, so the
    # old `sleep 5` guess is replaced by a real readiness probe consumers gate on.
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  prefect-worker:
    build: *backend-build
    image: ai-workflow-automation-backend:latest
    restart: always
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        uv run prefect config set PREFECT_API_URL=http://prefect-server:4200/api &&
        uv run prefect worker start --pool 'my-process-pool' --type process
    env_file:
      - ./backend/.env
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
    depends_on:
      prefect-server:
        condition: service_healthy
    mem_limit: 512m

  backend:
    build: *backend-build
    image: ai-workflow-automation-backend:latest
    ports:
      - "8000:8000"
    # --reload picks up edits through the ./backend bind mount; the image CMD
    # has no reloader so this is what makes local backend edits live.
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
    mem_limit: 768m
    restart: unless-stopped

  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    environment:
      # Must be browser-reachable: all API calls are client-side, so this is the
      # host URL, not the container-internal http://backend:8000.
      - PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./website:/app
      - frontend_node_modules:/app/node_modules
      - frontend_svelte_kit:/app/.svelte-kit
    mem_limit: 1g
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8081:8080
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  frontend_svelte_kit:
